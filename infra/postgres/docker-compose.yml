services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-flow}
      POSTGRES_USER: ${POSTGRES_USER:-flow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-flow_local_only}
    ports:
      - "5432:5432"
    volumes:
      - flow-postgres-data:/var/lib/postgresql/data
      - ../../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ../../database/constraints.sql:/docker-entrypoint-initdb.d/02-constraints.sql:ro
      - ../../database/indexes.sql:/docker-entrypoint-initdb.d/03-indexes.sql:ro
      - ../../database/migrations/001_notifications.sql:/docker-entrypoint-initdb.d/05-notifications.sql:ro
      - ../../database/migrations/002_task_comments.sql:/docker-entrypoint-initdb.d/06-task-comments.sql:ro
      - ../../database/migrations/003_task_board_and_activity.sql:/docker-entrypoint-initdb.d/07-task-board-and-activity.sql:ro
      - ../../database/migrations/004_task_imports.sql:/docker-entrypoint-initdb.d/08-task-imports.sql:ro
      - ../../database/migrations/005_dashboard_metrics.sql:/docker-entrypoint-initdb.d/09-dashboard-metrics.sql:ro
      - ../../database/migrations/006_workspace_administration.sql:/docker-entrypoint-initdb.d/10-workspace-administration.sql:ro
      - ../../database/migrations/007_workspace_panels.sql:/docker-entrypoint-initdb.d/11-workspace-panels.sql:ro
      - ../../database/migrations/008_task_details.sql:/docker-entrypoint-initdb.d/12-task-details.sql:ro
      - ../../database/migrations/009_task_creation_requests.sql:/docker-entrypoint-initdb.d/13-task-creation-requests.sql:ro
      - ../../database/migrations/010_task_attachment_files.sql:/docker-entrypoint-initdb.d/14-task-attachment-files.sql:ro
      - ../../database/migrations/011_task_schedule.sql:/docker-entrypoint-initdb.d/15-task-schedule.sql:ro
      - ../../database/migrations/012_workspace_operations.sql:/docker-entrypoint-initdb.d/16-workspace-operations.sql:ro
      - ../../database/migrations/013_audit_details.sql:/docker-entrypoint-initdb.d/17-audit-details.sql:ro
      - ../../database/migrations/014_workspace_users.sql:/docker-entrypoint-initdb.d/18-workspace-users.sql:ro
      - ../../database/migrations/015_password_sessions.sql:/docker-entrypoint-initdb.d/19-password-sessions.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-flow} -d ${POSTGRES_DB:-flow}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  flow-postgres-data:
